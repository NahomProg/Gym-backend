spring:
  datasource:
    url: jdbc:h2:mem:gymdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api/v1

jwt:
  secret: test-secret-key-for-junit-tests-only-not-for-production-use-1234
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS}

rate:
  limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE}
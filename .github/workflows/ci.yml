name: Gym Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test

    env:
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      JWT_ACCESS_TOKEN_EXPIRY_MS: ${{ vars.JWT_ACCESS_TOKEN_EXPIRY_MS }}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${{ vars.RATE_LIMIT_LOGIN_PER_MINUTE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: bash mvnw -B clean test

      - name: Package application
        run: bash mvnw -B package -DskipTests

      - name: Build Docker image
        run: docker build -t gym-backend:${{ github.sha }} .